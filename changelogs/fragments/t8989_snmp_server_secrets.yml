---
bugfixes:
  - httpapi plugin - send a batch of commands as the bare list the VyOS API expects. Every module that applies configuration failed without it.
  - vyos_snmp_server - remove the ``tsm_key`` option, which VyOS does not have and which could only produce an invalid command.
  - vyos_snmp_server - use the device names ``trap-source`` and ``smux-peer`` in API paths, so updating or removing either no longer fails once it exists.
  - vyos_snmp_server - ``smux_peer`` is now a list, because the device supports several; a single value is still accepted.
  - vyos_snmp_server - ``deleted`` with a ``config`` removes only what it names; without a ``config`` it still removes all SNMP configuration.
security_fixes:
  - vyos_snmp_server - mask the SNMPv3 keys, community names and trap community read from the device in ``before``, ``after`` and ``gathered``.
  - vyos_snmp_server - add ``include_secrets`` to return those values in ``gathered``.
minor_changes:
  - vyos_snmp_server - document that ``plaintext_key`` is never read back, so a task that sets it reports a change on every run.
