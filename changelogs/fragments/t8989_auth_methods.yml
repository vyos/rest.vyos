minor_changes:
  - vyos httpapi plugin - add support for four additional authentication
    methods against the VyOS REST API - ``header`` (API key sent as an
    ``X-API-Key`` header), ``bearer`` (a VyOS-issued bearer token, fetched
    once and cached until it expires), ``mtls`` (mutual TLS, with no
    application-level credential sent at all), and ``oidc`` (a bearer
    token obtained from an external OpenID Connect provider via the
    client_credentials grant, likewise fetched and cached) - selectable
    via the new ``auth_method`` option. The existing API-key-in-the-request-body
    behaviour remains the default, so no change is required for existing
    inventories.
  - vyos httpapi plugin - the OIDC token endpoint must use ``https``, because
    the request carries the client secret and the response carries a bearer
    token. A plain ``http`` endpoint (for example a lab identity provider) is
    accepted only with the new ``oidc_allow_insecure_http`` option, which logs
    a warning, and other URL schemes are never accepted. Certificate
    validation of the token endpoint can be turned off for a self-signed lab
    provider with ``oidc_validate_certs``, and the request is bounded by
    ``oidc_timeout``.
