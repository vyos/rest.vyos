---
- debug:
    msg: START vyos_route_maps gathered integration tests on connection={{ ansible_connection }}

- include_tasks: _remove_config.yaml
- block:
    - include_tasks: _populate_config.yaml

    - name: Gather route_maps configuration
      register: result
      vyos.rest.vyos_route_maps:
        state: gathered

    - assert:
        that:
          - result.changed == false
          - result.gathered | selectattr('route_map','eq','RM-TEST-EXPORT-POLICY') | list | length == 1

  always:
    - include_tasks: _remove_config.yaml
