---
# tests/integration/targets/vyos_route_maps/tasks/main.yaml

- name: TEARDOWN — delete all route maps before tests
  vyos.rest.vyos_route_maps:
    state: deleted

# ------------------------------------------------------------------
# MERGED
# ------------------------------------------------------------------

- name: MERGED — create route map
  register: result
  vyos.rest.vyos_route_maps:
    config:
      - route_map: RM-TEST-EXPORT-POLICY
        entries:
          - sequence: 10
            action: permit
            match:
              peer: 192.0.2.32
            set:
              metric: "5"
              as_path_exclude: "111"
              aggregator:
                as: 100
    state: merged

- name: ASSERT — merged changed
  assert:
    that:
      - result.changed == true

- name: MERGED — idempotency check
  register: result
  vyos.rest.vyos_route_maps:
    config:
      - route_map: RM-TEST-EXPORT-POLICY
        entries:
          - sequence: 10
            action: permit
            match:
              peer: 192.0.2.32
            set:
              metric: "5"
              as_path_exclude: "111"
              aggregator:
                as: 100
    state: merged

- name: ASSERT — merged idempotent
  assert:
    that:
      - result.changed == false
      - result.commands | length == 0

# ------------------------------------------------------------------
# GATHERED
# ------------------------------------------------------------------

- name: GATHERED — read current route maps
  register: result
  vyos.rest.vyos_route_maps:
    state: gathered

- name: ASSERT — gathered has expected route map
  assert:
    that:
      - result.gathered | selectattr('route_map','eq','RM-TEST-EXPORT-POLICY') | list | length == 1

# ------------------------------------------------------------------
# REPLACED
# ------------------------------------------------------------------

- name: REPLACED — replace route map with updated set
  register: result
  vyos.rest.vyos_route_maps:
    config:
      - route_map: RM-TEST-EXPORT-POLICY
        entries:
          - sequence: 10
            action: permit
            set:
              metric: "10"
    state: replaced

- name: ASSERT — replaced changed
  assert:
    that:
      - result.changed == true

- name: REPLACED — idempotency check
  register: result
  vyos.rest.vyos_route_maps:
    config:
      - route_map: RM-TEST-EXPORT-POLICY
        entries:
          - sequence: 10
            action: permit
            set:
              metric: "10"
    state: replaced

- name: ASSERT — replaced idempotent
  assert:
    that:
      - result.changed == false

# ------------------------------------------------------------------
# DELETED
# ------------------------------------------------------------------

- name: DELETED — remove specific route map
  register: result
  vyos.rest.vyos_route_maps:
    config:
      - route_map: RM-TEST-EXPORT-POLICY
    state: deleted

- name: ASSERT — deleted changed
  assert:
    that:
      - result.changed == true

- name: DELETED — idempotency check
  register: result
  vyos.rest.vyos_route_maps:
    state: deleted

- name: ASSERT — deleted idempotent
  assert:
    that:
      - result.changed == false
