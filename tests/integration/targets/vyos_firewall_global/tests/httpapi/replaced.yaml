---
- debug:
    msg: START vyos_firewall_global replaced integration tests on connection={{ ansible_connection }}

- include_tasks: _remove_config.yaml
- block:
    - include_tasks: _populate_config.yaml

    - name: Replace firewall global configuration
      register: result
      vyos.rest.vyos_firewall_global: &id001
        config:
          group:
            network_group:
              - name: DMZ
                network:
                  - 10.0.0.0/8
        state: replaced

    - assert:
        that:
          - result.changed == true

    - name: Replace firewall global configuration (IDEMPOTENT)
      register: result
      vyos.rest.vyos_firewall_global: *id001

    - assert:
        that:
          - result.changed == false
          - result.commands == []

  always:
    - include_tasks: _remove_config.yaml
