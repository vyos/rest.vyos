---
- debug:
    msg: START vyos_hostname merged integration tests on connection={{ ansible_connection }}

- include_tasks: _remove_config.yaml

- block:
    - name: Merge hostname configuration
      register: result
      vyos.rest.vyos_hostname: &id001
        config:
          hostname: ansible-test-host
        state: merged

    - assert:
        that:
          - result.changed == true

    - name: Merge hostname configuration (IDEMPOTENT)
      register: result
      vyos.rest.vyos_hostname: *id001

    - name: Assert idempotent
      assert:
        that:
          - result.changed == false
          - result.commands == []

  always:
    - include_tasks: _remove_config.yaml
