---
- name: Configure SNMP first (required for LLDP snmp)
  vyos.rest.vyos_snmp_server:
    config:
      communities:
        - name: lldp-test
          authorization_type: ro
    state: merged

- name: Populate lldp_global config for testing
  vyos.rest.vyos_lldp_global:
    config:
      enable: true
      addresses:
        - 192.0.2.17
      snmp: enable
      legacy_protocols:
        - cdp
        - sonmp
    state: merged
