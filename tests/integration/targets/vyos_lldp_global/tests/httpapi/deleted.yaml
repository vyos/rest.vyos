---
- debug:
    msg: START vyos_lldp_global deleted integration tests on connection={{ ansible_connection }}

- include_tasks: _remove_config.yaml
- block:
    - include_tasks: _populate_config.yaml

    - name: Delete all lldp_global configuration
      register: result
      vyos.rest.vyos_lldp_global: &id001
        state: deleted

    - assert:
        that:
          - result.changed == true

    - name: Delete lldp_global configuration (IDEMPOTENT)
      register: result
      vyos.rest.vyos_lldp_global: *id001

    - name: Assert idempotent
      assert:
        that:
          - result.changed == false

  always:
    - include_tasks: _remove_config.yaml
