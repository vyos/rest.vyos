---
- name: Populate ospfv2 config for testing
  vyos.rest.vyos_ospfv2:
    config:
      parameters:
        router_id: 192.0.1.1
        abr_type: cisco
      auto_cost:
        reference_bandwidth: 2
      log_adjacency_changes: detail
      redistribute:
        - route_type: bgp
          metric: 10
      passive_interface:
        - eth1
      areas:
        - area_id: "2"
          area_type:
            normal: true
          network:
            - address: 192.0.2.0/24
        - area_id: "3"
          area_type:
            nssa:
              set: true
        - area_id: "4"
          area_type:
            stub:
              default_cost: 20
          range:
            - address: 192.0.3.0/24
              cost: 10
    state: merged
  ignore_errors: true
