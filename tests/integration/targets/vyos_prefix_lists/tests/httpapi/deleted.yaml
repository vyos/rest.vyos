---
- debug:
    msg: START vyos_prefix_lists deleted integration tests on connection={{ ansible_connection }}

- include_tasks: _remove_config.yaml
- block:
    - include_tasks: _populate_config.yaml

    - name: Delete all prefix_lists configuration
      register: result
      vyos.rest.vyos_prefix_lists: &id001
        state: deleted

    - assert:
        that:
          - result.changed == true

    - name: Delete prefix_lists configuration (IDEMPOTENT)
      register: result
      vyos.rest.vyos_prefix_lists: *id001

    - name: Assert idempotent
      assert:
        that:
          - result.changed == false

  always:
    - include_tasks: _remove_config.yaml
