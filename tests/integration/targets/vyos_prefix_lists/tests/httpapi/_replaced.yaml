---
- debug:
    msg: START vyos_prefix_lists replaced integration tests on connection={{ ansible_connection }}

- include_tasks: _remove_config.yaml
- include_tasks: _populate_config.yaml

- block:
    - name: Replace prefix_lists configuration
      register: result
      vyos.rest.vyos_prefix_lists: &id001
        config:
          - afi: ipv4
            prefix_lists:
              - name: AnsibleIPv4PrefixList
                entries:
                  - sequence: 10
                    action: permit
                    prefix: 10.0.0.0/8
        state: replaced

    - assert:
        that:
          - result.changed == true

    - name: Replace prefix_lists configuration (IDEMPOTENT)
      register: result
      vyos.rest.vyos_prefix_lists: *id001

    - name: Assert idempotent
      assert:
        that:
          - result.changed == false
          - result.commands == []

  always:
    - include_tasks: _remove_config.yaml
