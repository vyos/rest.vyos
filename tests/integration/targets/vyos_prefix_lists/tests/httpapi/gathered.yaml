---
- debug:
    msg: START vyos_prefix_lists gathered integration tests on connection={{ ansible_connection }}

- include_tasks: _remove_config.yaml
- block:
    - include_tasks: _populate_config.yaml

    - name: Gather prefix_lists configuration
      register: result
      vyos.rest.vyos_prefix_lists:
        state: gathered

    - assert:
        that:
          - result.changed == false
          - result.gathered | selectattr('afi','eq','ipv4') | list | length > 0

  always:
    - include_tasks: _remove_config.yaml
