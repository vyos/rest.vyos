---
- debug:
    msg: START vyos_bgp_address_family replaced integration tests on connection={{ ansible_connection }}

- include_tasks: _remove_config.yaml
- block:
    - include_tasks: _populate_config.yaml

    - name: Replace BGP address-family configuration
      register: result
      vyos.rest.vyos_bgp_address_family: &id001
        config:
          as_number: 65000
          address_family:
            - afi: ipv4
              networks:
                - prefix: 192.0.3.0/24
        state: replaced

    - assert:
        that:
          - result.changed == true

    - name: Replace BGP address-family configuration (IDEMPOTENT)
      register: result
      vyos.rest.vyos_bgp_address_family: *id001

    - assert:
        that:
          - result.changed == false
          - result.commands == []

  always:
    - include_tasks: _remove_config.yaml
