---
- debug:
    msg: START vyos_bgp_address_family round trip integration tests on connection={{ ansible_connection }}

- include_tasks: _remove_config.yaml

- block:
    - name: RTT - Setup BGP global
      vyos.rest.vyos_bgp_global:
        config:
          as_number: 65000
          neighbors:
            - neighbor_address: 192.0.2.1
              remote_as: 65001
        state: merged

    - name: RTT - Apply base configuration
      vyos.rest.vyos_bgp_address_family:
        config:
          as_number: 65000
          address_family:
            - afi: ipv4
              networks:
                - prefix: 192.0.2.0/24
          neighbors:
            - neighbor_address: 192.0.2.1
              address_family:
                - afi: ipv4
                  soft_reconfiguration: true
        state: merged

    - name: RTT - Gather
      register: gathered
      vyos.rest.vyos_bgp_address_family:
        state: gathered

    - assert:
        that:
          - gathered.gathered.address_family | selectattr('afi', 'eq', 'ipv4') | list | length == 1
          - gathered.gathered.neighbors | selectattr('neighbor_address', 'eq', '192.0.2.1') | list | length == 1

    - name: RTT - Modify configuration
      vyos.rest.vyos_bgp_address_family:
        config:
          as_number: 65000
          address_family:
            - afi: ipv4
              networks:
                - prefix: 192.0.3.0/24
        state: replaced

    - name: RTT - Gather after modify
      register: gathered2
      vyos.rest.vyos_bgp_address_family:
        state: gathered

    - assert:
        that:
          - (gathered2.gathered.address_family | selectattr('afi', 'eq', 'ipv4') | first).networks[0].prefix == '192.0.3.0/24'

  always:
    - include_tasks: _remove_config.yaml
