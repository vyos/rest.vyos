---
- debug:
    msg: START vyos_bgp_address_family gathered integration tests on connection={{ ansible_connection }}

- include_tasks: _remove_config.yaml
- block:
    - include_tasks: _populate_config.yaml

    - name: Gather BGP address-family configuration
      register: result
      vyos.rest.vyos_bgp_address_family:
        state: gathered

    - assert:
        that:
          - result.gathered.as_number == 65000
          - result.gathered.address_family | selectattr('afi', 'eq', 'ipv4') | list | length == 1
          - result.gathered.neighbors | selectattr('neighbor_address', 'eq', '192.0.2.1') | list | length == 1

  always:
    - include_tasks: _remove_config.yaml
