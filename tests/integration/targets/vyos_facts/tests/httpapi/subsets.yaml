---
- debug:
    msg: START vyos_facts subsets integration tests on connection={{ ansible_connection }}

- block:
    - include_tasks: _populate_config.yaml

    - name: Gather logging subset
      vyos.rest.vyos_facts:
        gather_subset:
          - logging

    - assert:
        that:
          - ansible_facts.vyos_logging is defined

    - name: Gather ntp subset
      vyos.rest.vyos_facts:
        gather_subset:
          - ntp

    - assert:
        that:
          - ansible_facts.vyos_ntp is defined

    - name: Gather interfaces subset
      vyos.rest.vyos_facts:
        gather_subset:
          - interfaces

    - assert:
        that:
          - ansible_facts.vyos_interfaces is defined

  always:
    - include_tasks: _remove_config.yaml
