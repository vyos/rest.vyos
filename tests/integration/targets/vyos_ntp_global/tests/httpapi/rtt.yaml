---
- debug:
    msg: START vyos_ntp_global round trip integration tests on connection={{ ansible_connection }}

- include_tasks: _remove_config.yaml

- block:
    - name: RTT - Apply base configuration
      vyos.rest.vyos_ntp_global:
        config:
          allow_clients:
            - 10.5.5.0/24
            - 10.6.6.0/24
          listen_addresses:
            - 10.1.2.3
          servers:
            - server: 203.0.113.10
              options:
                - prefer
        state: merged

    - name: RTT - Gather
      register: gathered
      vyos.rest.vyos_ntp_global:
        state: gathered

    - name: RTT - Assert base configuration present
      assert:
        that:
          - "'10.5.5.0/24' in gathered.gathered.allow_clients"
          - "'10.6.6.0/24' in gathered.gathered.allow_clients"
          - "'10.1.2.3' in gathered.gathered.listen_addresses"
          - "'203.0.113.10' in gathered.gathered.servers | map(attribute='server')"
          - (gathered.gathered.servers | selectattr('server', 'eq', '203.0.113.10') | first).options == ['prefer']

    - name: RTT - Modify configuration (remove a stale allow_client, add a server option)
      vyos.rest.vyos_ntp_global:
        config:
          allow_clients:
            - 10.5.5.0/24
          listen_addresses:
            - 10.1.2.3
          servers:
            - server: 203.0.113.10
              options:
                - prefer
                - nts
        state: replaced

    - name: RTT - Gather after modify
      register: gathered2
      vyos.rest.vyos_ntp_global:
        state: gathered

    - name: RTT - Assert stale entry removed and update applied
      assert:
        that:
          - "'10.5.5.0/24' in gathered2.gathered.allow_clients"
          - "'10.6.6.0/24' not in gathered2.gathered.allow_clients"
          - (gathered2.gathered.servers | selectattr('server', 'eq', '203.0.113.10') | first).options | sort == ['nts', 'prefer']

  always:
    - include_tasks: _remove_config.yaml
