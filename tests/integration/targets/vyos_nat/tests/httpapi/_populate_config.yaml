---
- name: Populate NAT config for testing
  vyos.rest.vyos_nat:
    config:
      nat:
        source:
          rule:
            - id: 100
              description: "Source rule 100"
              outbound_interface:
                name: eth0
              translation:
                address: masquerade
            - id: 101
              outbound_interface:
                name: eth1
              translation:
                address: masquerade
        destination:
          rule:
            - id: 200
              protocol: tcp
              inbound_interface:
                name: eth0
              destination:
                address: 198.51.100.10
                port: "80"
              translation:
                address: 192.168.1.10
                port: "8080"
        static:
          rule:
            - id: 300
              inbound_interface: eth0
              destination:
                address: 198.51.100.20
              translation:
                address: 192.168.1.20
    state: merged
