---
- debug:
    msg: START vyos_firewall_rules deleted integration tests on connection={{ ansible_connection }}

- include_tasks: _remove_config.yaml
- block:
    - include_tasks: _populate_config.yaml

    - name: Delete all firewall rules configuration
      register: result
      vyos.rest.vyos_firewall_rules:
        state: deleted

    - assert:
        that:
          - result.changed == true

    - name: Delete all firewall rules configuration (IDEMPOTENT)
      register: result
      vyos.rest.vyos_firewall_rules:
        state: deleted

    - assert:
        that:
          - result.changed == false
          - result.commands == []

  always:
    - include_tasks: _remove_config.yaml
