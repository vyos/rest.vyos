---
- debug:
    msg: START vyos_logging_global replaced integration tests on connection={{ ansible_connection }}

- include_tasks: _remove_config.yaml
- block:
    - include_tasks: _populate_config.yaml

    - name: Replace logging_global configuration
      register: result
      vyos.rest.vyos_logging_global: &id001
        config:
          console:
            facilities:
              - facility: local6
        state: replaced

    - assert:
        that:
          - result.changed == true

    - name: Replace logging_global configuration (IDEMPOTENT)
      register: result
      vyos.rest.vyos_logging_global: *id001

    - name: Assert idempotent
      assert:
        that:
          - result.changed == false
          - result.commands == []

  always:
    - include_tasks: _remove_config.yaml
