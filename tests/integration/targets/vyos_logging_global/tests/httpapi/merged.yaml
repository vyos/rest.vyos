---
- debug:
    msg: START vyos_logging_global merged integration tests on connection={{ ansible_connection }}

- include_tasks: _remove_config.yaml

- block:
    - name: Merge logging_global configuration
      register: result
      vyos.rest.vyos_logging_global: &id001
        config:
          console:
            facilities:
              - facility: local7
                severity: err
          hosts:
            - hostname: 172.16.0.1
              port: 514
              facilities:
                - facility: local7
                  severity: all
          global_params:
            facilities:
              - facility: cron
                severity: debug
            preserve_fqdn: true
        state: merged

    - assert:
        that:
          - result.changed == true

    - name: Merge logging_global configuration (IDEMPOTENT)
      register: result
      vyos.rest.vyos_logging_global: *id001

    - name: Assert idempotent
      assert:
        that:
          - result.changed == false
          - result.commands == []

  always:
    - include_tasks: _remove_config.yaml
