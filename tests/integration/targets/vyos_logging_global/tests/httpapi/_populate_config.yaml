---
- name: Populate logging_global config for testing
  vyos.rest.vyos_logging_global:
    config:
      console:
        facilities:
          - facility: local7
            severity: err
      hosts:
        - hostname: 172.16.0.1
          port: 514
          facilities:
            - facility: local7
              severity: all
      global_params:
        facilities:
          - facility: cron
            severity: debug
        preserve_fqdn: true
    state: merged
  ignore_errors: true
