---
- debug:
    msg: START vyos_bgp_global deleted integration tests on connection={{ ansible_connection }}

- include_tasks: _remove_config.yaml
- include_tasks: _populate_config.yaml

- block:
    - name: Delete BGP configuration
      register: result
      vyos.rest.vyos_bgp_global:
        state: deleted

    - assert:
        that:
          - result.changed == true

    - name: Delete BGP configuration (IDEMPOTENT)
      register: result
      vyos.rest.vyos_bgp_global:
        state: deleted

    - assert:
        that:
          - result.changed == false
          - result.commands == []

  always:
    - include_tasks: _remove_config.yaml
