---
- debug:
    msg: START vyos_bgp_global round trip integration tests on connection={{ ansible_connection }}

- include_tasks: _remove_config.yaml

- block:
    - name: RTT - Apply base configuration
      vyos.rest.vyos_bgp_global:
        config:
          as_number: 65000
          parameters:
            router_id: 192.0.1.1
          neighbors:
            - neighbor_address: 192.0.2.1
              remote_as: 65001
        state: merged

    - name: RTT - Gather
      register: gathered
      vyos.rest.vyos_bgp_global:
        state: gathered

    - assert:
        that:
          - gathered.gathered.as_number == 65000
          - gathered.gathered.parameters.router_id == "192.0.1.1"

    - name: RTT - Modify configuration
      vyos.rest.vyos_bgp_global:
        config:
          as_number: 65000
          parameters:
            router_id: 192.0.1.2
          neighbors:
            - neighbor_address: 192.0.2.1
              remote_as: 65001
        state: replaced

    - name: RTT - Gather after modify
      register: gathered2
      vyos.rest.vyos_bgp_global:
        state: gathered

    - assert:
        that:
          - gathered2.gathered.parameters.router_id == "192.0.1.2"

  always:
    - include_tasks: _remove_config.yaml
