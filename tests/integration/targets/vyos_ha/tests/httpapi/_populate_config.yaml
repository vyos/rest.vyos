---
- name: Populate HA config for testing
  vyos.rest.vyos_ha:
    config:
      vrrp:
        global_parameters:
          startup_delay: 30
          garp:
            master_repeat: 6
        groups:
          - name: g1
            interface: eth0
            vrid: 20
            priority: 100
            address:
              - 192.168.1.100/24
            peer_address: 192.168.1.3
          - name: g2
            interface: eth1
            vrid: 21
            priority: 50
            address:
              - 192.168.2.100/24
        sync_groups:
          - name: sg1
            member: [g1]
            health_check:
              failure_count: 5
              ping: 192.168.1.1
        snmp: enabled
      virtual_servers:
        - name: s1
          address: 10.10.10.5
          algorithm: round-robin
          port: 80
          protocol: tcp
          real_server:
            - address: 10.10.50.2
              port: 8080
    state: merged
